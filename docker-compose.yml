services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: carnaval
      POSTGRES_USER: carnaval
      POSTGRES_PASSWORD: carnaval
    ports:
      - "5432:5432"
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # protocolo AMQP, el que usa la aplicación
      - "15672:15672"   # consola web, usuario y clave: guest
  pagos:
    build: ./pagos-servicio
    ports:
      - "8081:8081"
    environment:
      DEMORA_MS: 0      # 5000 para la práctica de fallos (05.5)